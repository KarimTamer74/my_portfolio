name: my_portfolio
description: "My personal portfolio app showcasing my projects, skills, and experiences."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.8.0
  scrollable_positioned_list: ^0.3.8
  carousel_slider: ^5.0.0
  visibility_detector: ^0.4.0+2
  http: ^1.4.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  comments_remover: ^1.0.2
  lottie: ^3.3.1
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mothooq_shots/
    - assets/images/taskify_shots/
    - assets/images/chatbot_shots/
    - assets/lottie/

 